x-python-image: &python-image
  image: solar-display-python:local
  build:
    context: .
    dockerfile: deploy/Dockerfile

services:
  collector:
    <<: *python-image
    container_name: solar-display-collector
    restart: unless-stopped
    user: "${SOLAR_UID}:${SOLAR_GID}"
    environment:
      FRONIUS_BASE_URL: "${FRONIUS_BASE_URL}"
      SOLAR_DB_PATH: /data/solar.db
      SOLAR_POLL_INTERVAL_SECONDS: "${SOLAR_POLL_INTERVAL_SECONDS:-10}"
      SOLAR_RAW_RETENTION_DAYS: "${SOLAR_RAW_RETENTION_DAYS:-7}"
      TZ: "${TZ:-Europe/Zurich}"
    volumes:
      - ./data:/data
    command: ["python3", "-m", "collector", "--db-path", "/data/solar.db", "loop"]

  dashboard-publisher:
    <<: *python-image
    container_name: solar-display-publisher
    restart: unless-stopped
    user: "${SOLAR_UID}:${SOLAR_GID}"
    environment:
      SOLAR_DB_PATH: /data/solar.db
      DASHBOARD_OUTPUT_PATH: /publish/dashboard.svg
      DASHBOARD_REFRESH_SECONDS: "${DASHBOARD_REFRESH_SECONDS:-300}"
      DASHBOARD_JSON_OUTPUT_PATH: /publish/dashboard.json
      DASHBOARD_JSON_REFRESH_SECONDS: "${DASHBOARD_JSON_REFRESH_SECONDS:-15}"
      DASHBOARD_STALE_SECONDS: "${DASHBOARD_STALE_SECONDS:-180}"
      SOLAR_LAT: "${SOLAR_LAT}"
      SOLAR_LON: "${SOLAR_LON}"
      SUN_DATA_REFRESH_SECONDS: "${SUN_DATA_REFRESH_SECONDS:-1800}"
      SUN_DATA_MAX_AGE_SECONDS: "${SUN_DATA_MAX_AGE_SECONDS:-21600}"
      SUN_DATA_CACHE_PATH: /data/sun-data.json
      CO2_AVOIDED_KG_PER_KWH: "${CO2_AVOIDED_KG_PER_KWH:-0.128}"
      TZ: "${TZ:-Europe/Zurich}"
    volumes:
      - ./data:/data
      - ./publish:/publish
    command: ["python3", "-m", "dashboard", "loop"]
    depends_on:
      - collector

  web:
    image: nginx:stable-alpine
    container_name: solar-display-web
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./publish:/usr/share/nginx/html:ro
      - ./web/dashboard.html:/usr/share/nginx/html/dashboard.html:ro
      - ./web/assets:/usr/share/nginx/html/assets:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dashboard-publisher
