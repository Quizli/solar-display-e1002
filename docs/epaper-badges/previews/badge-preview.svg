<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif" width="800" height="480" viewBox="0 0 800 480"><rect width="800" height="480" fill="#FFFFFF" /><text font-size="24" font-weight="700" x="32" y="44" fill="#000000">Besondere Solarereignisse</text><text font-size="17" font-weight="700" x="32" y="113" fill="#000000">Rekord</text><svg x="232" y="72" width="540" height="72" viewBox="250 324 540 72"><line x1="255" y1="325" x2="785" y2="325" stroke="#000000" stroke-width="1.2" /><text x="255" y="354" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#000000">Rekordtag: Heute sind bereits 135,7 kWh</text><text x="255" y="374" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#000000">zusammengekommen. Bisher: 128,4 kWh.</text><g data-story-badge="record" transform="translate(727 336)"><rect width="48" height="48" rx="4" fill="#FFD400" /><g fill="#000000"><path d="M13 9h22v7c0 8-3 12-8 14v5h7v4H14v-4h7v-5c-5-2-8-6-8-14z" /><path d="M14 13H7v4c0 6 4 10 11 10m16-14h7v4c0 6-4 10-11 10" fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round" /></g></g><line x1="255" y1="395" x2="785" y2="395" stroke="#000000" stroke-width="1.2" /></svg><text font-size="17" font-weight="700" x="32" y="213" fill="#000000">Meilenstein</text><svg x="232" y="172" width="540" height="72" viewBox="250 324 540 72"><line x1="255" y1="325" x2="785" y2="325" stroke="#000000" stroke-width="1.2" /><text x="255" y="365" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#000000">1’000 Tage Solarstrom vom Dach. Vierstellig!</text><text x="255" y="374" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#000000" /><g data-story-badge="milestone" transform="translate(727 336)"><rect width="48" height="48" rx="4" fill="#149B24" /><polygon fill="#FFFFFF" points="24,6 29,18 42,1